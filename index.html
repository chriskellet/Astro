<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Astrobot">
  <meta name="theme-color" content="#000000">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">

  <!-- Standard favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">

  <title>Astrobot Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      z-index: 100;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }

    .loader {
      border: 4px solid #333;
      border-top: 4px solid #00a8ff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #skin-selection {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2000;
      color: white;
      overflow: hidden;
    }

    #skin-selection.hidden {
      display: none;
    }

    .skin-selection-header {
      flex-shrink: 0;
      text-align: center;
      padding: 20px;
      width: 100%;
    }

    #skin-selection h1 {
      font-size: 48px;
      margin: 0 0 10px 0;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }

    #skin-selection p {
      font-size: 20px;
      margin: 0;
      opacity: 0.9;
    }

    .skin-grid-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      padding: 10px;
      align-content: start;
    }

    .skin-selection-footer {
      flex-shrink: 0;
      padding: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .skin-card {
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .skin-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .skin-card.selected {
      border-color: #00a8ff;
      background: rgba(0, 168, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
    }

    .skin-preview {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      position: relative;
      overflow: hidden;
    }

    .skin-preview::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
    }

    .skin-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .skin-description {
      font-size: 14px;
      opacity: 0.8;
    }

    .start-button {
      margin: 0;
      padding: 15px 50px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #00a8ff 0%, #0066cc 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 168, 255, 0.4);
    }

    .start-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 168, 255, 0.6);
    }

    .start-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .skin-selection-header {
        padding: 15px;
      }

      #skin-selection h1 {
        font-size: 28px;
      }

      #skin-selection p {
        font-size: 16px;
      }

      .skin-grid-container {
        padding: 0 15px;
      }

      .skin-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .skin-card {
        padding: 15px 10px;
      }

      .skin-preview {
        width: 70px;
        height: 70px;
        font-size: 35px;
        margin-bottom: 10px;
      }

      .skin-name {
        font-size: 16px;
      }

      .skin-description {
        font-size: 12px;
      }

      .skin-selection-footer {
        padding: 15px;
      }

      .start-button {
        padding: 12px 40px;
        font-size: 20px;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .skin-selection-header {
        padding: 10px;
      }

      #skin-selection h1 {
        font-size: 24px;
      }

      #skin-selection p {
        font-size: 14px;
      }

      .skin-grid-container {
        padding: 0 10px;
      }

      .skin-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        max-width: 100%;
      }

      .skin-card {
        padding: 10px 6px;
      }

      .skin-preview {
        width: 50px;
        height: 50px;
        font-size: 25px;
        margin-bottom: 6px;
      }

      .skin-name {
        font-size: 12px;
        margin-bottom: 3px;
      }

      .skin-description {
        font-size: 10px;
      }

      .skin-selection-footer {
        padding: 10px;
      }

      .start-button {
        padding: 8px 30px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="skin-selection">
    <div class="skin-selection-header">
      <h1>Choose Your Character</h1>
      <p>Select a skin to start your adventure!</p>
    </div>

    <div class="skin-grid-container">
      <div class="skin-grid" id="skin-grid">
        <!-- Skins will be populated by JavaScript -->
      </div>
    </div>

    <div class="skin-selection-footer">
      <button class="start-button" id="start-game">Start Game</button>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="loader"></div>
    <div>Loading Astrobot...</div>
  </div>

  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="level">Level 1</div>
    <div id="health">Health: 100</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
