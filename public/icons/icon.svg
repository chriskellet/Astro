<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Robot body -->
  <g transform="translate(256, 280)">
    <!-- Body -->
    <rect x="-60" y="-40" width="120" height="100" rx="10" fill="#00a8ff"/>

    <!-- Head -->
    <circle cx="0" cy="-70" r="40" fill="#00a8ff"/>

    <!-- Eyes -->
    <circle cx="-15" cy="-75" r="8" fill="#fff"/>
    <circle cx="15" cy="-75" r="8" fill="#fff"/>
    <circle cx="-15" cy="-75" r="4" fill="#000"/>
    <circle cx="15" cy="-75" r="4" fill="#000"/>

    <!-- Antenna -->
    <line x1="0" y1="-110" x2="0" y2="-130" stroke="#00a8ff" stroke-width="4"/>
    <circle cx="0" cy="-135" r="8" fill="#ffff00"/>

    <!-- Arms -->
    <rect x="-90" y="-20" width="30" height="60" rx="8" fill="#00a8ff"/>
    <rect x="60" y="-20" width="30" height="60" rx="8" fill="#00a8ff"/>

    <!-- Legs -->
    <rect x="-45" y="60" width="30" height="70" rx="8" fill="#0066cc"/>
    <rect x="15" y="60" width="30" height="70" rx="8" fill="#0066cc"/>

    <!-- Chest detail -->
    <circle cx="0" cy="0" r="12" fill="#ffff00"/>
    <rect x="-3" y="-8" width="6" height="16" fill="#ff6600"/>
    <rect x="-8" y="-3" width="16" height="6" fill="#ff6600"/>
  </g>

  <!-- Stars -->
  <circle cx="100" cy="80" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="420" cy="120" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="420" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="400" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="150" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="380" cy="50" r="2" fill="#fff" opacity="0.6"/>
</svg>
